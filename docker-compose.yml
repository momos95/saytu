# SAYTU - on-premise stack.
#   scripts/generate-secrets.sh && docker compose up -d --build
#   UI: ${SAYTU_PUBLIC_URL} (default http://localhost:8080)   SSO: ${SAYTU_KEYCLOAK_PUBLIC_URL}
# Optional local LLM: docker compose --profile ai up -d
#
# Services: postgres, keycloak, api, worker (scanners), web (+ optional ollama).

name: saytu

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saytu}
      POSTGRES_USER: ${POSTGRES_USER:-saytu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  # One-shot job, run on every "up": creates the Keycloak role and database if missing and
  # (re)applies KEYCLOAK_DB_PASSWORD from .env. Idempotent; works on an existing volume.
  # The SQL lives here, not in a script file, so Windows line endings (CRLF) cannot break it.
  keycloak-db-init:
    image: postgres:16-alpine
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-saytu}
      PGDATABASE: ${POSTGRES_DB:-saytu}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    command:
      - sh
      - -ec
      - |
        psql -X -q -v ON_ERROR_STOP=1 -v kc_password="$$KEYCLOAK_DB_PASSWORD" <<'SQL'
        SELECT 'CREATE ROLE keycloak' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') \gexec
        ALTER ROLE keycloak WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'kc_password';
        SELECT 'CREATE DATABASE keycloak OWNER keycloak ENCODING ''UTF8'' TEMPLATE template0'
         WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak') \gexec
        REVOKE ALL ON DATABASE keycloak FROM PUBLIC;
        -- the application database is not reachable by the keycloak role
        SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', current_database()) \gexec
        SQL
        echo "keycloak database ready"
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${SAYTU_KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      # Lets the API reach Keycloak at http://keycloak:8080 while tokens keep the public issuer
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      # placeholders substituted in the realm import
      SAYTU_PUBLIC_URL: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
      SAYTU_INITIAL_ADMIN_USERNAME: ${SAYTU_INITIAL_ADMIN_USERNAME:-admin}
      SAYTU_INITIAL_ADMIN_PASSWORD: ${SAYTU_INITIAL_ADMIN_PASSWORD:?set SAYTU_INITIAL_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/keycloak/saytu-realm.json:/opt/keycloak/data/import/saytu-realm.json:ro
    ports:
      - "${SAYTU_KEYCLOAK_PORT:-8180}:8080"
    networks: [data, edge]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      # the image has no curl: plain HTTP request on the management port through bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536m }

  # One-shot, at every "up": creates the Keycloak client used by the user management page
  # (saytu realm only) and gives its secret to the API through a volume. See docs/automation.md.
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.4
    restart: "no"
    user: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    entrypoint: ["/bin/bash", "/opt/saytu/keycloak-admin-client-init.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KC_ADMIN_USER: ${KC_BOOTSTRAP_ADMIN_USERNAME:-kcadmin}
      KC_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      SAYTU_KEYCLOAK_ADMIN_CLIENT_SECRET: ${SAYTU_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      SAYTU_PUBLIC_URL: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ./infra/keycloak/keycloak-admin-client-init.sh:/opt/saytu/keycloak-admin-client-init.sh:ro
      - keycloak-admin-secret:/secrets
    networks: [data]
    depends_on:
      keycloak:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ./backend
      target: api
      # PEM certificates in ./data/ca are trusted at build time (Maven) and at runtime (Git platforms)
      additional_contexts:
        ca: ${SAYTU_CA_DIR:-./data/ca}
        scanners: ./scanners
      args:
        SKIP_TESTS: ${SAYTU_SKIP_TESTS:-false}
    image: saytu/api:${SAYTU_VERSION:-dev}
    environment:
      SAYTU_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saytu}
      SAYTU_DB_USER: ${POSTGRES_USER:-saytu}
      SAYTU_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SAYTU_OIDC_ISSUER: ${SAYTU_KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/saytu
      SAYTU_OIDC_JWK_SET_URI: http://keycloak:8080/realms/saytu/protocol/openid-connect/certs
      SAYTU_OIDC_AUDIENCE: saytu-api
      SAYTU_OIDC_WEB_CLIENT_ID: saytu-web
      SAYTU_CORS_ALLOWED_ORIGINS: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
      SAYTU_EXPOSE_API_DOCS: ${SAYTU_EXPOSE_API_DOCS:-false}
      SAYTU_PUBLIC_URL: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
      # user management page: confidential client of the saytu realm, created by "keycloak-config"
      SAYTU_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      SAYTU_KEYCLOAK_ADMIN_CLIENT_ID: saytu-admin-api
      SAYTU_KEYCLOAK_ADMIN_CLIENT_SECRET: ${SAYTU_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      SAYTU_KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/saytu-secrets/keycloak-admin-client-secret
      SAYTU_MASTER_KEY: ${SAYTU_MASTER_KEY:?set SAYTU_MASTER_KEY in .env}
      SAYTU_PREVIOUS_MASTER_KEYS: ${SAYTU_PREVIOUS_MASTER_KEYS:-}
      SAYTU_GIT_ALLOW_PLAIN_HTTP: ${SAYTU_GIT_ALLOW_PLAIN_HTTP:-false}
      SAYTU_GIT_CA_BUNDLE: ${SAYTU_GIT_CA_BUNDLE_IN_CONTAINER:-}
      SAYTU_LOCAL_REPOS_ROOT: /srv/git
      # Outbound proxy towards github.com / gitlab.com, if the site requires one
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
        ${SAYTU_JAVA_PROXY_OPTS:-}
    volumes:
      # Local repositories (LOCAL connections), mounted read-only
      - ${SAYTU_LOCAL_REPOS_HOST_DIR:-./data/local-repos}:/srv/git:ro
      # Internal CA certificates (PEM), optional extra bundle for Git platforms, see SAYTU_GIT_CA_BUNDLE
      - ${SAYTU_CA_DIR:-./data/ca}:/etc/saytu/ca:ro
      # secret of the Keycloak client "saytu-admin-api", written by keycloak-config
      - keycloak-admin-secret:/run/saytu-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    networks: [data, edge]
    # not published: reached through the web container (/api)
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536m }

  # Executes the audits: clones repositories and runs Opengrep, Trivy and Gitleaks in bounded
  # sub-processes. Same application as "api" with SAYTU_WORKER_ENABLED=true; no published port.
  worker:
    <<: *hardening
    build:
      context: ./backend
      target: worker
      additional_contexts:
        ca: ${SAYTU_CA_DIR:-./data/ca}
        scanners: ./scanners
      args:
        SKIP_TESTS: ${SAYTU_SKIP_TESTS:-false}
    image: saytu/worker:${SAYTU_VERSION:-dev}
    environment:
      SAYTU_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saytu}
      SAYTU_DB_USER: ${POSTGRES_USER:-saytu}
      SAYTU_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SAYTU_OIDC_ISSUER: ${SAYTU_KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/saytu
      SAYTU_OIDC_JWK_SET_URI: http://keycloak:8080/realms/saytu/protocol/openid-connect/certs
      SAYTU_OIDC_AUDIENCE: saytu-api
      SAYTU_MASTER_KEY: ${SAYTU_MASTER_KEY:?set SAYTU_MASTER_KEY in .env}
      SAYTU_PREVIOUS_MASTER_KEYS: ${SAYTU_PREVIOUS_MASTER_KEYS:-}
      SAYTU_GIT_ALLOW_PLAIN_HTTP: ${SAYTU_GIT_ALLOW_PLAIN_HTTP:-false}
      SAYTU_GIT_CA_BUNDLE: ${SAYTU_GIT_CA_BUNDLE_IN_CONTAINER:-}
      SAYTU_LOCAL_REPOS_ROOT: /srv/git
      SAYTU_WORKER_ENABLED: "true"
      SAYTU_PUBLIC_URL: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
      SAYTU_WORKER_ID: worker-1
      SAYTU_WORKER_MAX_PARALLEL_JOBS: ${SAYTU_WORKER_MAX_PARALLEL_JOBS:-2}
      # downloads public advisories only (never code); set to false on an air-gapped site
      SAYTU_TRIVY_DB_AUTO_UPDATE: ${SAYTU_TRIVY_DB_AUTO_UPDATE:-true}
      SAYTU_TRIVY_DB_REPOSITORY: ${SAYTU_TRIVY_DB_REPOSITORY:-}
      SAYTU_CHECKOUT_MAX_MB: ${SAYTU_CHECKOUT_MAX_MB:-2048}
      # outbound proxy for clones and the vulnerability database, if the site requires one
      HTTPS_PROXY: ${SAYTU_HTTPS_PROXY:-}
      NO_PROXY: ${SAYTU_NO_PROXY:-}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=25 -XX:+ExitOnOutOfMemoryError
        ${SAYTU_JAVA_PROXY_OPTS:-}
    volumes:
      - ${SAYTU_LOCAL_REPOS_HOST_DIR:-./data/local-repos}:/srv/git:ro
      - ${SAYTU_CA_DIR:-./data/ca}:/etc/saytu/ca:ro
      # optional rule packs installed with scripts/fetch-opengrep-rules.sh
      - ./data/rules:/etc/saytu/rules:ro
      - trivy-db:/var/lib/saytu/trivy
      - scan-work:/var/lib/saytu/work
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    networks: [data, edge]
    depends_on:
      # the API applies the database migrations first
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "4", memory: 6g }

  web:
    <<: *hardening
    build:
      context: ./frontend
      additional_contexts:
        ca: ${SAYTU_CA_DIR:-./data/ca}
    image: saytu/web:${SAYTU_VERSION:-dev}
    environment:
      SAYTU_OIDC_ISSUER: ${SAYTU_KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/saytu
      SAYTU_OIDC_CLIENT_ID: saytu-web
      SAYTU_PUBLIC_URL: ${SAYTU_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${SAYTU_HTTP_PORT:-8080}:8080"
    cap_drop: [ALL]
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  ollama:
    <<: *hardening
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama:/root/.ollama
    networks: [data]
    # no published port: only the API/worker talk to it, over the internal network
    deploy:
      resources:
        limits: { cpus: "4", memory: 12g }

networks:
  # database and internal services; no route to the outside world
  data:
    internal: true
  # browser-facing services
  edge: {}

volumes:
  pgdata: {}
  # secret of the Keycloak client used by the user management page (keycloak-config -> api)
  keycloak-admin-secret: {}
  ollama: {}
  # Trivy vulnerability database (refreshed by the worker, or copied by hand when offline)
  trivy-db: {}
  # checkouts and reports of running jobs (wiped after each job)
  scan-work: {}
