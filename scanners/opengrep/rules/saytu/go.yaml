rules:
  - id: saytu.go.tls-insecure-skip-verify
    languages: [go]
    severity: ERROR
    message: InsecureSkipVerify disables TLS certificate verification; connections can be intercepted.
    metadata:
      category: security
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      remediation: Remove InsecureSkipVerify; add the internal CA to tls.Config.RootCAs instead.
      references: ["https://pkg.go.dev/crypto/tls#Config"]
    pattern-either:
      - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
      - pattern: $C.InsecureSkipVerify = true

  - id: saytu.go.sql-injection
    languages: [go]
    severity: ERROR
    message: SQL query built with fmt.Sprintf or concatenation (SQL injection).
    metadata:
      category: security
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Use placeholders ($1 / ?) and pass the values as arguments to Query / Exec.
      references: ["https://go.dev/doc/database/sql-injection"]
    patterns:
      - pattern-either:
          - pattern: $DB.$M(fmt.Sprintf(...), ...)
          - pattern: $DB.$M($CTX, fmt.Sprintf(...), ...)
          - pattern: $DB.$M($A + $B, ...)
          - pattern: $DB.$M($CTX, $A + $B, ...)
          - patterns:
              - pattern-inside: |
                  $Q := fmt.Sprintf(...)
                  ...
              - pattern-either:
                  - pattern: $DB.$M($Q, ...)
                  - pattern: $DB.$M($CTX, $Q, ...)
      - pattern-not: $DB.$M("..." + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(Query|QueryRow|Exec|QueryContext|QueryRowContext|ExecContext|Prepare|PrepareContext|Raw|Select|Get)$

  - id: saytu.go.command-injection
    languages: [go]
    severity: ERROR
    message: Shell command built from a variable (exec.Command with sh -c); an attacker can inject commands.
    metadata:
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Call exec.Command with a fixed binary and separate arguments, without a shell.
      references: ["https://pkg.go.dev/os/exec"]
    patterns:
      - pattern-either:
          - pattern: exec.Command("$SH", "-c", $X, ...)
          - pattern: exec.CommandContext($CTX, "$SH", "-c", $X, ...)
      - metavariable-regex:
          metavariable: $SH
          regex: ^((/usr)?/bin/)?(ba|z|da)?sh$
      - pattern-not: exec.Command("$SH", "-c", "...", ...)
      - pattern-not: exec.CommandContext($CTX, "$SH", "-c", "...", ...)

  - id: saytu.go.weak-hash
    languages: [go]
    severity: WARNING
    message: MD5 / SHA-1 are broken hash functions; do not use them for security.
    metadata:
      category: security
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      remediation: Use crypto/sha256 or stronger; hash passwords with golang.org/x/crypto/argon2 or bcrypt.
      references: ["https://pkg.go.dev/crypto/md5"]
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
