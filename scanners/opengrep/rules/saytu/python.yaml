# SAYTU rule pack - Python. Licence: Apache-2.0. Tests: python.py (opengrep --test).
rules:
  - id: saytu.python.command-injection
    languages: [python]
    severity: ERROR
    message: Shell command built from a variable (os.system, os.popen, subprocess with shell=True); an attacker can inject commands.
    metadata:
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Call subprocess.run with a list of arguments and shell=False; validate values against an allow-list.
      references: ["https://docs.python.org/3/library/subprocess.html#security-considerations"]
    patterns:
      - pattern-either:
          - pattern: os.system($X)
          - pattern: os.popen($X, ...)
          - pattern: subprocess.$F($X, ..., shell=True, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: saytu.python.sql-injection
    languages: [python]
    severity: ERROR
    message: SQL query built with string formatting or concatenation (SQL injection).
    metadata:
      category: security
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Pass the values as parameters, e.g. cursor.execute("SELECT ... WHERE id = %s", (user_id,)).
      references: ["https://peps.python.org/pep-0249/#paramstyle"]
    patterns:
      - pattern-either:
        - pattern: $C.$M("..." % $X, ...)
        - pattern: $C.$M("...".format(...), ...)
        - pattern: $C.$M(f"...", ...)
        - pattern: $C.$M("..." + $X, ...)
        - patterns:
            - pattern-inside: |
                $Q = "..." % $X
                ...
            - pattern: $C.$M($Q, ...)
        - patterns:
            - pattern-inside: |
                $Q = f"..."
                ...
            - pattern: $C.$M($Q, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(execute|executemany|executescript|raw|extra)$

  - id: saytu.python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Deserialising untrusted data with pickle / marshal / yaml.load (unsafe loader) can execute code.
    metadata:
      category: security
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      remediation: Use JSON, or yaml.safe_load; never unpickle data that crosses a trust boundary.
      references: ["https://docs.python.org/3/library/pickle.html"]
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: marshal.loads(...)
          - pattern: yaml.load($D)
          - pattern: yaml.load($D, Loader=yaml.Loader)
          - pattern: yaml.load($D, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($D, Loader=yaml.FullLoader)
          - pattern: yaml.unsafe_load(...)

  - id: saytu.python.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled (verify=False / unverified SSL context).
    metadata:
      category: security
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      remediation: Keep verification on; point verify= (or REQUESTS_CA_BUNDLE) at the internal CA bundle instead.
      references: ["https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification"]
    pattern-either:
      - pattern: $R.$M(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: saytu.python.weak-hash
    languages: [python]
    severity: WARNING
    message: MD5 / SHA-1 are broken hash functions; do not use them for security.
    metadata:
      category: security
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      remediation: Use hashlib.sha256 or stronger (or pass usedforsecurity=False for non-security checksums); hash passwords with argon2 / bcrypt / hashlib.scrypt.
      references: ["https://docs.python.org/3/library/hashlib.html"]
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("=~/^(?i)(md5|sha1)$/", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)

  - id: saytu.python.flask-debug
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes the interactive Werkzeug debugger, which allows running code on the server.
    metadata:
      category: security
      cwe: ["CWE-489: Active Debug Code"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      remediation: Never enable debug=True outside a developer workstation; drive it from an environment variable that defaults to False.
      references: ["https://flask.palletsprojects.com/en/stable/debugging/"]
    pattern: $APP.run(..., debug=True, ...)
