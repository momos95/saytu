# SAYTU rule pack - JavaScript / TypeScript. Licence: Apache-2.0. Tests: javascript.js (opengrep --test).
rules:
  - id: saytu.js.eval-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Code built at run time from a variable (eval / new Function / string timer) can run attacker-supplied code.
    metadata:
      category: security
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Remove eval. Parse data with JSON.parse and select behaviour with a lookup table of functions.
      references: ["https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval#never_use_direct_eval!"]
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
          # a string timer is evaluated like eval; a function reference is not
          - pattern: setTimeout($A + $B, ...)
          - pattern: setInterval($A + $B, ...)
          - pattern: setTimeout(`...${...}...`, ...)
          - pattern: setInterval(`...${...}...`, ...)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")

  - id: saytu.js.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell command built from a variable (child_process.exec / execSync); an attacker can inject commands.
    metadata:
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Use execFile / spawn with a fixed executable and an array of arguments, without the shell option.
      references: ["https://nodejs.org/api/child_process.html#child_processexecfilefile-args-options-callback"]
    patterns:
      - pattern-either:
          - pattern: $CP.exec($A + $B, ...)
          - pattern: $CP.execSync($A + $B, ...)
          - pattern: $CP.exec(`...${...}...`, ...)
          - pattern: $CP.execSync(`...${...}...`, ...)
          - pattern: exec($A + $B, ...)
          - pattern: execSync($A + $B, ...)
          - pattern: exec(`...${...}...`, ...)
          - pattern: execSync(`...${...}...`, ...)
      - pattern-either:
          - pattern-inside: |
              $CP = require('child_process')
              ...
          - pattern-inside: |
              import $CP from 'child_process'
              ...
          - pattern-inside: |
              import * as $CP from 'child_process'
              ...
          - pattern-inside: |
              import { ..., exec, ... } from 'child_process'
              ...
          - pattern-inside: |
              import { ..., execSync, ... } from 'child_process'
              ...
          - pattern-inside: |
              const { ..., exec, ... } = require('child_process')
              ...
          - pattern-inside: |
              const { ..., execSync, ... } = require('child_process')
              ...

  - id: saytu.js.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled; connections can be intercepted.
    metadata:
      category: security
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      remediation: Remove rejectUnauthorized false / NODE_TLS_REJECT_UNAUTHORIZED=0; trust an internal CA with the ca option or NODE_EXTRA_CA_CERTS.
      references: ["https://nodejs.org/api/tls.html#tlsconnectoptions-callback"]
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0

  - id: saytu.js.dom-xss-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML inserted from a variable (innerHTML / outerHTML / document.write); untrusted values lead to XSS.
    metadata:
      category: security
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: LOW
      remediation: Use textContent for text, or sanitise the HTML with a vetted library (e.g. DOMPurify) before insertion.
      references: ["https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html"]
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
          - pattern: $EL.insertAdjacentHTML($POS, $X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: document.write("...")
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: $EL.innerHTML = $P.sanitize(...)
      - pattern-not: $EL.innerHTML = DOMPurify.sanitize(...)

  - id: saytu.js.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 / SHA-1 are broken hash functions; do not use them for security.
    metadata:
      category: security
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      remediation: Use sha256 or stronger; for passwords use argon2, bcrypt or scrypt.
      references: ["https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"]
    pattern-either:
      - pattern: $C.createHash("=~/^(?i)(md4|md5|sha1)$/")
      - pattern: createHash("=~/^(?i)(md4|md5|sha1)$/")

  - id: saytu.js.sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL query built from a variable by concatenation or template string (SQL injection).
    metadata:
      category: security
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      remediation: Pass values as query parameters (e.g. db.query('SELECT ... WHERE id = $1', [id])).
      references: ["https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html"]
    patterns:
      - pattern-either:
          - pattern: $DB.$M("$SQL" + $X, ...)
          - pattern: $DB.$M("$SQL" + $X + $Y, ...)
          - pattern: $DB.$M(`$SQL${$X}...`, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(query|execute|raw|exec|run|all|get|prepare|\$queryRawUnsafe|\$executeRawUnsafe)$
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^\s*(select|insert|update|delete|merge|with|replace)\b
