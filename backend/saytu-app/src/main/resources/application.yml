# SAYTU - every value can be overridden with environment variables (see .env.example).
spring:
  application:
    name: saytu
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SAYTU_DB_URL:jdbc:postgresql://localhost:5432/saytu}
    username: ${SAYTU_DB_USER:saytu}
    password: ${SAYTU_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SAYTU_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # the schema is owned by Flyway; Hibernate only checks that entities match it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued for the public URL used by browsers...
          issuer-uri: ${SAYTU_OIDC_ISSUER:http://localhost:8180/realms/saytu}
          # ...but keys are fetched from Keycloak over the internal Docker network.
          jwk-set-uri: ${SAYTU_OIDC_JWK_SET_URI:http://localhost:8180/realms/saytu/protocol/openid-connect/certs}
          audiences: ${SAYTU_OIDC_AUDIENCE:saytu-api}

saytu:
  version: '@project.version@'
  security:
    web-client-id: ${SAYTU_OIDC_WEB_CLIENT_ID:saytu-web}
    expose-api-docs: ${SAYTU_EXPOSE_API_DOCS:false}
  cors:
    allowed-origins: ${SAYTU_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  vault:
    # base64 of 32 random bytes; the application refuses to start without it
    master-key: ${SAYTU_MASTER_KEY:}
    previous-master-keys: ${SAYTU_PREVIOUS_MASTER_KEYS:}
  git:
    connect-timeout: ${SAYTU_GIT_CONNECT_TIMEOUT:10s}
    request-timeout: ${SAYTU_GIT_REQUEST_TIMEOUT:30s}
    allow-plain-http: ${SAYTU_GIT_ALLOW_PLAIN_HTTP:false}
    allow-loopback: ${SAYTU_GIT_ALLOW_LOOPBACK:false}
    ca-bundle: ${SAYTU_GIT_CA_BUNDLE:}
    local-repos-root: ${SAYTU_LOCAL_REPOS_ROOT:}
    use-system-proxy: ${SAYTU_GIT_USE_SYSTEM_PROXY:true}
  scan:
    worker:
      # only the "worker" service of Docker Compose sets it: the API process never runs scanners
      enabled: ${SAYTU_WORKER_ENABLED:false}
      id: ${SAYTU_WORKER_ID:}
      max-parallel-jobs: ${SAYTU_WORKER_MAX_PARALLEL_JOBS:2}
      poll-interval: ${SAYTU_WORKER_POLL_INTERVAL:PT5S}
      lease: ${SAYTU_WORKER_LEASE:PT5M}
      work-dir: ${SAYTU_WORKER_WORK_DIR:/var/lib/saytu/work}
    tools:
      trivy-cache-dir: ${SAYTU_TRIVY_CACHE_DIR:/var/lib/saytu/trivy}
      trivy-db-auto-update: ${SAYTU_TRIVY_DB_AUTO_UPDATE:true}
      trivy-db-repository: ${SAYTU_TRIVY_DB_REPOSITORY:}
      trivy-db-update-interval: ${SAYTU_TRIVY_DB_UPDATE_INTERVAL:PT12H}
      opengrep-runtime: ${SAYTU_OPENGREP_RUNTIME:/opt/saytu/tools/opengrep-runtime}
    checkout:
      timeout: ${SAYTU_CHECKOUT_TIMEOUT:PT10M}
      max-mb: ${SAYTU_CHECKOUT_MAX_MB:2048}
      max-files: ${SAYTU_CHECKOUT_MAX_FILES:500000}

springdoc:
  api-docs:
    enabled: ${SAYTU_EXPOSE_API_DOCS:false}
  swagger-ui:
    enabled: ${SAYTU_EXPOSE_API_DOCS:false}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

logging:
  level:
    root: INFO
    # never log HTTP bodies / headers of outgoing Git API calls (they carry tokens)
    org.apache.hc.client5.http.wire: OFF
    org.springframework.web.client: INFO
